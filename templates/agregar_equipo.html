<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar Equipo Nuevo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-body">
        <h3 class="mb-4">Agregar Equipo Nuevo</h3>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
          <div class="mb-3">
            <label>Rama</label>
            <select name="rama" class="form-select" required>
              <option value="DAMAS">Damas</option>
              <option value="CABALLEROS">Caballeros</option>
            </select>
          </div>
          <div class="mb-3">
            <label>Club</label>
            <input list="clubes" name="club" class="form-control" required>
            <datalist id="clubes">
              {% for club, rama in equipos %}
              <option value="{{ club }}">
              {% endfor %}
            </datalist>
          </div>
          <div class="mb-3">
            <label>Categoría</label>
            <select name="categoria" class="form-select" required>
              {% for c in categorias %}
              <option value="{{ c }}">{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-success">Guardar equipo</button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-secondary ms-2">Volver</a>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
