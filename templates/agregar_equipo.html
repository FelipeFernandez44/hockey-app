<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar nuevo equipo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <h1>Agregar nuevo equipo</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <label for="equipo">Seleccioná el equipo (club y rama):</label><br>
        <select name="club" required>
            {% for club, rama in equipos %}
                <option value="{{ club }}">{{ club }} - {{ rama }}</option>
            {% endfor %}
        </select><br><br>

        <label for="rama">Rama:</label><br>
        <select name="rama" required>
            {% for _, rama in equipos|unique(attribute=1) %}
                <option value="{{ rama }}">{{ rama }}</option>
            {% endfor %}
        </select><br><br>

        <label for="categoria">Categoría:</label><br>
        <select name="categoria" required>
            {% for cat in categorias %}
                <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
        </select><br><br>

        <button type="submit">Agregar equipo</button>
    </form>

    <br>
    <a href="{{ url_for('dashboard') }}">← Volver al dashboard</a>
</body>
</html>
