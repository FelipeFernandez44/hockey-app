<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar Equipo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
      <h3 class="text-center mb-4">📋 Agregar nuevo equipo</h3>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} text-center">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% if error %}
        <div class="alert alert-danger text-center">⚠️ {{ error }}</div>
      {% endif %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">🏑 Club</label>
          <select name="club" id="club-select" class="form-select" required>
            <option value="">Seleccioná un club</option>
            {% for club, rama in equipos|sort %}
              <option value="{{ club }}">{{ club }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">👥 Rama</label>
          <select name="rama" id="rama-select" class="form-select" required>
            <option value="">Seleccioná una rama</option>
            <option value="DAMAS">Damas</option>
            <option value="CABALLEROS">Caballeros</option>
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label">🎯 Categoría</label>
          <select name="categoria" class="form-select" required>
            <option value="">Seleccioná una categoría</option>
            {% for cat in categorias %}
              <option value="{{ cat }}">{{ cat|capitalize }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-success">✅ Agregar equipo</button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary mt-2">⬅️ Volver al Dashboard</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Corrección para evitar error de serialización si no hay contextos
    window.contextosData = {{ session.get("contextos") | default({}) | tojson | safe }};
  </script>

</body>
</html>
