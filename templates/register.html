<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrarse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card p-4 shadow">
      <h3 class="text-center mb-4">Crear cuenta</h3>
      <form method="POST">
        <div class="row mb-3">
          <div class="col">
            <label>DNI</label>
            <input type="text" name="dni" class="form-control" required>
          </div>
          <div class="col">
            <label>Nombre y Apellido</label>
            <input type="text" name="nombre" class="form-control" required>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col">
            <label>Fecha de Nacimiento</label>
            <input type="date" name="fecha_nac" class="form-control" required>
          </div>
          <div class="col">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="col">
            <label>Contraseña</label>
            <input type="password" name="password" class="form-control" required>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col">
            <label>Club</label>
            <input list="equipos" name="club" class="form-control" required>
            <datalist id="equipos">
              {% for equipo in equipos %}
              <option value="{{ equipo }}">
              {% endfor %}
            </datalist>
          </div>
          <div class="col">
            <label>Rama</label>
            <select name="rama" class="form-select" required>
              <option value="DAMAS">Damas</option>
              <option value="CABALLEROS">Caballeros</option>
            </select>
          </div>
        </div>
        <div class="text-center mb-3">
          <label>Plan</label>
          <select name="plan" class="form-select w-50 mx-auto" required>
            {% for plan in planes %}
            <option value="{{ plan }}">{{ plan|capitalize }}</option>
            {% endfor %}
          </select>
        </div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
        <a href="{{ url_for('login') }}" class="d-block mt-2 text-center">Ya tengo cuenta</a>
      </form>
    </div>
  </div>
</body>
</html>
